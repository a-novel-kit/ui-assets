name: main

on:
  merge_group:
  push:
    branches:
      - "**"
      # merge_group already runs the queue; a push run on its branch would repeat every job.
      - "!gh-readonly-queue/**"
    tags-ignore:
      - "**"

jobs:
  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/setup-node@v1.81.2
        id: setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Fetch from LFS only the PNG sources that the image check reads.
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: lfs.fetchinclude
          GIT_CONFIG_VALUE_0: packages/images/raw/*/exports/*.png
        with:
          token: ${{ steps.setup.outputs.token }}
          clean: false
          lfs: true
          persist-credentials: false
      - name: Materialize LFS sources
        run: git lfs checkout
      - name: Run lint
        run: pnpm run lint:ci

  scan-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/scan-secrets@v1.81.2
        with:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          version: "8.30.1"

  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.81.2
        with:
          # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
          version: "1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9"

  build-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/build-node@v1.81.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_action: "build:ci"
